name: B1 Terraform B2 provider (manual)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["terraform_b2/**", ".github/workflows/b1-terraform-b2.yml"]
permissions:
  contents: read
concurrency:
  group: terraform-b2
  cancel-in-progress: false
jobs:
  b2:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform_b2
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_APP_KEY }}
      B2_APPLICATION_KEY_ID: ${{ secrets.B2_TF_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_TF_APP_KEY }}
      TF_IN_AUTOMATION: "true"
      TF_STATE_BUCKET: tfstate-aayush
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.16.5
      - name: Init
        run: terraform init -input=false -backend-config="bucket=${TF_STATE_BUCKET}" -backend-config='endpoints={s3="https://s3.eu-central-003.backblazeb2.com"}'
      - run: terraform fmt -check -recursive
      - run: terraform validate
      - name: Plan
        run: terraform plan -input=false -out=tfplan -lock=false
      - name: Apply
        run: terraform apply -input=false -auto-approve tfplan
      - name: Verify what Terraform created (bucket, lifecycle rules, upload-only key)
        run: |
          set -e
          KEY_ID=$(terraform output -raw upload_key_id)
          KEY_SECRET=$(terraform output -raw upload_key_secret)
          echo "::add-mask::$KEY_SECRET"
          BUCKET_ID=$(terraform output -raw bucket_id)
          AUTH=$(curl -s -u "$B2_APPLICATION_KEY_ID:$B2_APPLICATION_KEY" https://api.backblazeb2.com/b2api/v3/b2_authorize_account)
          API=$(echo "$AUTH" | python3 -c 'import sys,json; print(json.load(sys.stdin)["apiInfo"]["storageApi"]["apiUrl"])')
          TOKEN=$(echo "$AUTH" | python3 -c 'import sys,json; print(json.load(sys.stdin)["authorizationToken"])')
          ACCT=$(echo "$AUTH" | python3 -c 'import sys,json; print(json.load(sys.stdin)["accountId"])')
          RULES=$(curl -s -H "Authorization: $TOKEN" -d "{\"accountId\":\"$ACCT\",\"bucketId\":\"$BUCKET_ID\"}" "$API/b2api/v3/b2_list_buckets" | python3 -c 'import sys,json; b=json.load(sys.stdin)["buckets"][0]; print([(r["fileNamePrefix"], r["daysFromUploadingToHiding"], r["daysFromHidingToDeleting"]) for r in b["lifecycleRules"]], "| type:", b["bucketType"])')
          echo "::notice title=B2-verify::lifecycle rules stored by Terraform: $RULES"
          KEYS=$(curl -s -H "Authorization: $TOKEN" -d "{\"accountId\":\"$ACCT\"}" "$API/b2api/v3/b2_list_keys")
          echo "::notice title=B2-verify::key created by Terraform (from the admin key list): $(echo "$KEYS" | python3 -c 'import sys,json; d=json.load(sys.stdin); print("all key names:", [k["keyName"] for k in d.get("keys", [])], "| matched:", [(k["keyName"], k["capabilities"], k.get("bucketIds") or k.get("bucketId")) for k in d.get("keys", []) if "tfprobe" in k["keyName"]], "| code:", d.get("code"), d.get("message"))' 2>&1 | head -c 400)"
          echo "::notice title=B2-verify::key id length ${#KEY_ID}, secret length ${#KEY_SECRET} (B2 key ids are 25 chars, secrets 31)"
          set +e
          echo "tf probe" > probe.txt
          S3="--endpoint-url https://s3.eu-central-003.backblazeb2.com --region eu-central-003"
          PUT=$(AWS_ACCESS_KEY_ID="$KEY_ID" AWS_SECRET_ACCESS_KEY="$KEY_SECRET" aws s3api put-object $S3 --bucket off-tfprobe-aayush-8392 --key raw/probe.txt --body probe.txt 2>&1 | tr '
' ' ' | head -c 220)
          echo "::notice title=B2-verify::S3 put-object with the Terraform-created upload-only key: ${PUT:-ok (no error)}"
          LST=$(AWS_ACCESS_KEY_ID="$KEY_ID" AWS_SECRET_ACCESS_KEY="$KEY_SECRET" aws s3api list-objects-v2 $S3 --bucket off-tfprobe-aayush-8392 2>&1 | tr '
' ' ' | head -c 220)
          echo "::notice title=B2-verify::S3 list-objects with the same key (expect denied): $LST"
          GET=$(AWS_ACCESS_KEY_ID="$KEY_ID" AWS_SECRET_ACCESS_KEY="$KEY_SECRET" aws s3api get-object $S3 --bucket off-tfprobe-aayush-8392 --key raw/probe.txt out.txt 2>&1 | tr '
' ' ' | head -c 220)
          echo "::notice title=B2-verify::S3 get-object with the same key (expect denied): $GET"
          DEL=$(AWS_ACCESS_KEY_ID="$KEY_ID" AWS_SECRET_ACCESS_KEY="$KEY_SECRET" aws s3api delete-object $S3 --bucket off-tfprobe-aayush-8392 --key raw/probe.txt 2>&1 | tr '
' ' ' | head -c 220)
          echo "::notice title=B2-verify::S3 delete-object with the same key (expect denied): ${DEL:-ALLOWED}"
      - name: Empty the bucket (all versions) with the admin key so it can be destroyed
        if: always()
        run: |
          pip install -q boto3
          python3 - <<'INNER'
          import os, boto3
          s3 = boto3.client("s3", endpoint_url="https://s3.eu-central-003.backblazeb2.com", region_name="eu-central-003",
                            aws_access_key_id=os.environ["B2_APPLICATION_KEY_ID"], aws_secret_access_key=os.environ["B2_APPLICATION_KEY"])
          n = 0
          for page in s3.get_paginator("list_object_versions").paginate(Bucket="off-tfprobe-aayush-8392"):
              for v in (page.get("Versions") or []) + (page.get("DeleteMarkers") or []):
                  s3.delete_object(Bucket="off-tfprobe-aayush-8392", Key=v["Key"], VersionId=v["VersionId"]); n += 1
          print("deleted versions:", n)
          INNER
      - name: Destroy (cleanup)
        if: always()
        run: terraform destroy -input=false -auto-approve
